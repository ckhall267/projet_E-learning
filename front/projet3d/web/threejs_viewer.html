<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient 3D Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1A1A2E;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <div>Patient 3D - Cliquez et glissez pour tourner</div>
        <div>Molette pour zoomer</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuration de la scène
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1A1A2E);

        // Caméra
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1.6, 3);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('container').appendChild(renderer.domElement);

        // Éclairage
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Modèle 3D simplifié du patient (silhouette humaine)
        const patientGroup = new THREE.Group();

        // Tête
        const headGeometry = new THREE.SphereGeometry(0.3, 32, 32);
        const headMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xFFDBAC,
            roughness: 0.7,
            metalness: 0.1
        });
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.set(0, 1.5, 0);
        head.castShadow = true;
        patientGroup.add(head);

        // Torse
        const torsoGeometry = new THREE.BoxGeometry(0.8, 1.2, 0.4);
        const torsoMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xFFDBAC,
            roughness: 0.7,
            metalness: 0.1
        });
        const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
        torso.position.set(0, 0.5, 0);
        torso.castShadow = true;
        patientGroup.add(torso);

        // Organes interactifs
        const organs = {};

        // Cœur
        const heartGeometry = new THREE.SphereGeometry(0.15, 16, 16);
        const heartMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xFF6B6B,
            emissive: 0x000000,
            roughness: 0.5,
            metalness: 0.3
        });
        const heart = new THREE.Mesh(heartGeometry, heartMaterial);
        heart.position.set(0.2, 0.8, 0.25);
        heart.userData = { name: 'Cœur', id: 'heart' };
        heart.castShadow = true;
        patientGroup.add(heart);
        organs.heart = heart;

        // Poumons
        const lungGeometry = new THREE.BoxGeometry(0.25, 0.4, 0.3);
        const lungMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x4ECDC4,
            emissive: 0x000000,
            roughness: 0.5,
            metalness: 0.3
        });
        
        const leftLung = new THREE.Mesh(lungGeometry, lungMaterial);
        leftLung.position.set(-0.3, 0.7, 0.2);
        leftLung.userData = { name: 'Poumon gauche', id: 'lungs' };
        leftLung.castShadow = true;
        patientGroup.add(leftLung);

        const rightLung = new THREE.Mesh(lungGeometry, lungMaterial);
        rightLung.position.set(0.3, 0.7, 0.2);
        rightLung.userData = { name: 'Poumon droit', id: 'lungs' };
        rightLung.castShadow = true;
        patientGroup.add(rightLung);
        organs.lungs = [leftLung, rightLung];

        // Cerveau
        const brainGeometry = new THREE.SphereGeometry(0.2, 16, 16);
        const brainMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x95E1D3,
            emissive: 0x000000,
            roughness: 0.5,
            metalness: 0.3
        });
        const brain = new THREE.Mesh(brainGeometry, brainMaterial);
        brain.position.set(0, 1.5, 0.1);
        brain.userData = { name: 'Cerveau', id: 'brain' };
        brain.castShadow = true;
        patientGroup.add(brain);
        organs.brain = brain;

        // Estomac
        const stomachGeometry = new THREE.SphereGeometry(0.2, 16, 16);
        const stomachMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xF38181,
            emissive: 0x000000,
            roughness: 0.5,
            metalness: 0.3
        });
        const stomach = new THREE.Mesh(stomachGeometry, stomachMaterial);
        stomach.position.set(0, 0.2, 0.25);
        stomach.userData = { name: 'Estomac', id: 'stomach' };
        stomach.castShadow = true;
        patientGroup.add(stomach);
        organs.stomach = stomach;

        scene.add(patientGroup);

        // Sol
        const floorGeometry = new THREE.PlaneGeometry(10, 10);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0F0F1E,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);

        // Contrôles de la caméra (rotation avec la souris)
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };

        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                
                rotation.y += deltaX * 0.01;
                rotation.x += deltaY * 0.01;
                
                // Limiter la rotation verticale
                rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));
                
                patientGroup.rotation.y = rotation.y;
                patientGroup.rotation.x = rotation.x;
                
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        renderer.domElement.addEventListener('mouseup', () => {
            isDragging = false;
        });

        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomSpeed = 0.1;
            camera.position.z += e.deltaY * zoomSpeed * 0.01;
            camera.position.z = Math.max(1, Math.min(10, camera.position.z));
        });

        // Raycasting pour la sélection d'organes
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(patientGroup.children, true);

            if (intersects.length > 0) {
                const selectedObject = intersects[0].object;
                if (selectedObject.userData.id) {
                    // Réinitialiser tous les organes
                    Object.values(organs).flat().forEach(organ => {
                        if (Array.isArray(organ)) {
                            organ.forEach(o => {
                                o.material.emissive.setHex(0x000000);
                                o.scale.set(1, 1, 1);
                            });
                        } else {
                            organ.material.emissive.setHex(0x000000);
                            organ.scale.set(1, 1, 1);
                        }
                    });

                    // Mettre en évidence l'organe sélectionné
                    const organId = selectedObject.userData.id;
                    if (organId === 'lungs') {
                        organs.lungs.forEach(lung => {
                            lung.material.emissive.setHex(0x23B8C0);
                            lung.scale.set(1.2, 1.2, 1.2);
                        });
                    } else if (organs[organId]) {
                        const organ = organs[organId];
                        if (Array.isArray(organ)) {
                            organ.forEach(o => {
                                o.material.emissive.setHex(0x23B8C0);
                                o.scale.set(1.2, 1.2, 1.2);
                            });
                        } else {
                            organ.material.emissive.setHex(0x23B8C0);
                            organ.scale.set(1.2, 1.2, 1.2);
                        }
                    }

                    // Envoyer un message au parent Flutter
                    if (window.parent) {
                        window.parent.postMessage({
                            type: 'organSelected',
                            organId: organId,
                            organName: selectedObject.userData.name
                        }, '*');
                    }
                }
            }
        });

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            // Animation subtile des organes
            const time = Date.now() * 0.001;
            if (organs.heart) {
                organs.heart.scale.set(
                    1 + Math.sin(time * 2) * 0.05,
                    1 + Math.sin(time * 2) * 0.05,
                    1 + Math.sin(time * 2) * 0.05
                );
            }
            
            renderer.render(scene, camera);
        }

        // Gestion du redimensionnement
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Démarrer l'animation
        animate();

        // Fonction pour recevoir des messages de Flutter
        window.addEventListener('message', (event) => {
            if (event.data.type === 'highlightOrgan') {
                const organId = event.data.organId;
                // Mettre en évidence l'organe spécifié
                if (organs[organId]) {
                    const organ = organs[organId];
                    if (Array.isArray(organ)) {
                        organ.forEach(o => {
                            o.material.emissive.setHex(0x23B8C0);
                            o.scale.set(1.2, 1.2, 1.2);
                        });
                    } else {
                        organ.material.emissive.setHex(0x23B8C0);
                        organ.scale.set(1.2, 1.2, 1.2);
                    }
                }
            } else if (event.data.type === 'resetHighlight') {
                // Réinitialiser tous les organes
                Object.values(organs).flat().forEach(organ => {
                    if (Array.isArray(organ)) {
                        organ.forEach(o => {
                            o.material.emissive.setHex(0x000000);
                            o.scale.set(1, 1, 1);
                        });
                    } else {
                        organ.material.emissive.setHex(0x000000);
                        organ.scale.set(1, 1, 1);
                    }
                });
            }
        });
    </script>
</body>
</html>
